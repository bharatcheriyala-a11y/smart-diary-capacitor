name: Build Clean APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Sync Capacitor Config & Web Assets
        run: npx cap sync android
      - name: Generate Proper Icons & Non-Stretched Splash Screens
        run: |
          pip install pillow
          python3 - << 'EOF'
          from PIL import Image
          import glob, os

          icons = sorted(glob.glob("assets/*.png"), reverse=True)
          icon_path = icons[0]
          print("Using icon:", icon_path)
          icon = Image.open(icon_path).convert("RGBA")

          # 1. Create clean 512x512 icon
          sq = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
          ic_fit = icon.resize((460, 460), Image.LANCZOS)
          sq.paste(ic_fit, (26, 26), ic_fit)
          sq.save("assets/final_icon.png")

          # 2. Generate properly proportioned splash screens (centered logo, zero stretching)
          for sp in glob.glob("android/app/src/main/res/**/splash.png", recursive=True):
              with Image.open(sp) as orig:
                  w, h = orig.size
              canvas = Image.new("RGBA", (w, h), (29, 78, 216, 255))
              logo_size = int(min(w, h) * 0.34)
              logo = icon.resize((logo_size, logo_size), Image.LANCZOS)
              canvas.paste(logo, ((w - logo_size) // 2, (h - logo_size) // 2), logo)
              canvas.save(sp)
          EOF
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          for dir in android/app/src/main/res/mipmap-*; do
            cp -f "assets/final_icon.png" "$dir/ic_launcher.png"
            cp -f "assets/final_icon.png" "$dir/ic_launcher_round.png"
            cp -f "assets/final_icon.png" "$dir/ic_launcher_foreground.png"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Grant execute permission
        run: chmod +x android/gradlew
      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Diary-Clean-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
